<!DOCTYPE html> 
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicknotes App      
    </title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Quicknote App</h1>  
      <div class="search-container">
        <button id="search-toggle-btn" class="search-icon-btn" aria-label="Search notes" title="Search notes">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <div id="search-box" class="search-box hidden">
          <input type="text" id="search-input" placeholder="Search saved notes..." autocomplete="off">
          <button id="search-clear-btn" class="search-clear-btn" aria-label="Clear search" title="Clear">✕</button>
        </div>
      </div>
    </header>
    <p class="app-sub-header">Here to help remember</p>
    <form id="note-form" class="note-card">
      <div class="form-group">
        <label for="note-text" class="note-label">Your Note</label>
        <textarea id="note-text" placeholder="Type your note here... (Press Escape to clear)" rows="4"></textarea>
        <div id="error-message" class="error-message" aria-live="polite"></div>
      </div>
      <div class="form-group">
        <label for="note-category" class="note-label">Category</label>
        <select id="note-category" class="note-category-select">
          <option value="General">General</option>
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Ideas">Ideas</option>
          <option value="Urgent">Urgent</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" id="add-note">Add Note</button>
      </div>
    </form>
    <section class="notes-section">
      <div class="notes-header">
        <span id="note-count" class="note-count">You have no notes yet.</span>
      </div>
      <ul id="notes-list"></ul>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
